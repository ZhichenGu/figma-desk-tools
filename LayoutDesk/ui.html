  .replace(/\b1 (layers|matches|text ranges|text layers|combinations|items|words|characters|lines)\b/g,(_,unit)=>'1 '+(unit==='matches'?'match':unit.slice(0,-1)))
  .replace(/^New (Type size|Font family|Style \/ weight|Line height|Tracking)/,(_,field)=>'New '+field.toLowerCase())
}
function displayLabel(value){return interfaceLanguage==='en'?englishLabel(value):value}
function translatePart(node,raw){
 const parent=node.parentElement
 if(!parent||parent.closest('script,style,textarea,[data-verbatim],.userLayer,.sample,.specimen,blockquote,#bank option,.example small,#issues details small,.pane b'))return raw
 if(parent.closest('#attributes')){
  const compact={family:'Font',style:'Weight',fontSize:'Size',lineHeight:'Line height',letterSpacing:'Tracking',all:'Full style'}
  return interfaceLanguage==='en'?(compact[parent.dataset.field]||raw):raw
 }
 if(parent.hasAttribute('data-name-tile'))return raw
 if(parent.closest('#groupList .materialRow span')){
  const sep=raw.indexOf(' · ')
  if(sep>=0)return displayLabel(raw.slice(0,sep))+raw.slice(sep)
 }
 return displayLabel(raw)
}
function updateText(node){
 let record=originals.get(node)
 if(!record||node.data!==record.display){record={source:node.data};originals.set(node,record)}
 const next=translatePart(node,record.source)
 record.display=next
 if(node.data!==next)node.data=next
}
const translatedAttrs=['placeholder','aria-label','title']
function updateAttrs(el){
 let records=attrOriginals.get(el)
 for(const name of translatedAttrs){
  if(!el.hasAttribute(name))continue
  if(!records){records={};attrOriginals.set(el,records)}
  const raw=el.getAttribute(name)
  if(!records[name]||raw!==records[name].display)records[name]={source:raw}
  const next=displayLabel(records[name].source);records[name].display=next
  if(raw!==next)el.setAttribute(name,next)
 }
}
function updateTree(root){
 if(root.nodeType===3){updateText(root);return}
 if(root.nodeType!==1||root.matches('script,style'))return
 updateAttrs(root)
 for(const child of root.childNodes)updateTree(child)
}
function refreshLanguage(){
 document.documentElement.lang=interfaceLanguage==='en'?'en':'zh-CN'
 languageButton.textContent=interfaceLanguage==='en'?'中文':'EN'
 languageButton.title=interfaceLanguage==='en'?'切换到中文':'Switch to English'
 updateTree(document.body)
 if(layout)render()
}
languageButton.onclick=()=>{
 userChoseLanguage=true;interfaceLanguage=interfaceLanguage==='zh'?'en':'zh'
 refreshLanguage();parent.postMessage({pluginMessage:{type:'saveLanguage',language:interfaceLanguage}},'*')
}
document.getElementById('repoLink').onclick=()=>parent.postMessage({pluginMessage:{type:'openProjectRepo'}},'*')
window.addEventListener('message',event=>{
 const m=event.data.pluginMessage
 if(m?.type!=='languageSettings')return
 if(!userChoseLanguage&&['zh','en'].includes(m.language))interfaceLanguage=m.language
 const repo=document.getElementById('repoLink')
 repo.disabled=!m.hasRepo
 if(m.hasRepo)repo.title='GitHub'
 refreshLanguage()
})
const languageObserver=new MutationObserver(changes=>{
 for(const change of changes){
  if(change.type==='characterData')updateText(change.target)
  else if(change.type==='attributes')updateAttrs(change.target)
  else for(const child of change.addedNodes)updateTree(child)
 }
})
languageObserver.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:translatedAttrs})
queueMicrotask(refreshLanguage)
parent.postMessage({pluginMessage:{type:'getLanguageSettings'}},'*')

let captureRevision=0

function closeCaptureSocket(){
 const socket=captureSocket
 captureSocket=null
 if(socket)socket.close()
}
function connectCapture(key){
 closeCaptureSocket()
 const socket=new WebSocket('ws://localhost:48371')
 captureSocket=socket
 socket.binaryType='blob'
 socket.onopen=()=>socket.send(key)
 socket.onclose=()=>{
  if(socket!==captureSocket)return
  captureSocket=null
  const revision=captureRevision
  if(++captureAttempts===1)send('wakeCapture')
  if(captureAttempts<8){
   setTimeout(()=>{if(revision===captureRevision)connectCapture(key)},450)
  }else{
   captureWindow(true)
   $('captureHint').textContent='请打开同一文件夹的 LayoutDeskCapture，再取消并重试。'
  }
 }
 socket.onerror=()=>{}
 socket.onmessage=async event=>{
  if(socket!==captureSocket)return
  if(typeof event.data!=='string'){
   const revision=++captureRevision
   try{await displayCapture(event.data,revision)}
   catch{if(revision===captureRevision){cancelCapture();tell('无法读取截图，请重新框选。')}}
   return
  }
  switch(event.data){
   case 'ready':
    socket.send(delayed?'arm':'captureNow')
    break
   case 'armed':$('captureHint').textContent='切换到目标窗口，按住 Shift，依次按 Z、A。';break
   case 'capturing':send('captureWindow','hide');break
   case 'cancelled':cancelCapture();break
   default:
    cancelCapture()
    tell(event.data==='shortcut-unavailable'?'截图快捷键被其他应用占用。':'截图失败，请检查 macOS 屏幕录制权限。')
  }

}

function saveBeforeFill(){

async function decodeItems(values){
 const items=[]
 for(const v of values){if(v.k==='text')items.push(v);else{const id=++serial;assets.set(id,await readAsset(new Blob([v.bytes])));items.push({k:'image',name:v.name,id})}}
 return items
}
function mapGroup(items,name,free=false){
 $('groupTitle').textContent=free?'核对填入位置':'填入已选图文'
 $('groupDialog').querySelector('.groupNames').hidden=free;$('groupName').required=!free
 $('groupDialog').querySelector('p').textContent=free?'为每项素材选择目标区域，也可以跳过。':'比如选中一位受访者的照片和原话，再为它们各选一个框。'
 $('groupDialog').querySelector('.groupActions .primary').textContent=free?'确认填入':'填入这一组'

 const list=$('groupList');list.replaceChildren();$('groupError').textContent=''
 $('groupName').value=name||''
 $('groupType').value=/文献|图书/.test(layout.name)?'文献':'受访者'
 const section=s=>{const match=s.n.match(/ (\d+)$/);return match?Number(match[1]):({'文献一':1,'文献二':2}[s.n]||0)}
 const numbers=[...new Set(layout.slots.filter(s=>s.k!=='line').map(section).filter(Boolean))]
 const next=numbers.find(n=>layout.slots.filter(s=>section(s)===n&&s.k!=='line').every(s=>!s.group&&!s.content&&!s.asset))
 const suggested=new Set()
 for(const item of items){
  const row=document.createElement('label'),caption=document.createElement('span'),menu=document.createElement('select')
  row.className='materialRow';caption.textContent=(item.k==='image'?'图片 · ':'文字 · ')+(item.text||item.name);caption.title=caption.textContent
  menu.add(new Option('跳过',''))
  layout.slots.forEach((s,i)=>{
   if(s.k!==item.k)return
   menu.add(new Option(s.n+(s.asset||s.content?'（替换已有内容）':''),i))
   if((free||!numbers.length||section(s)===next)&&!menu.value&&!suggested.has(i)&&!s.asset&&!s.content){menu.value=String(i);suggested.add(i)}
  })
  if(free&&item===items[0]&&pickTarget?.k===item.k){
   const old=menu.value;if(old)suggested.delete(Number(old))
   const index=layout.slots.indexOf(pickTarget);if(index>=0){menu.value=String(index);suggested.add(index)}
  }
  row.append(caption,menu);list.append(row)
 }
 $('groupDialog').querySelector('form').onsubmit=e=>{

  if((!free&&!name)||!used.length||new Set(used).size!==used.length){$('groupError').textContent=free?'请选择至少一个区域，每个区域只能使用一次。':'请填写组名，并给每项素材选择不同的区域。';return}

  selected=Number(used[0]);populate();render();$('groupDialog').close();if(free){rememberPrevious(previous);tell('已填入 '+used.length+' 项。可用版本菜单返回填入前。')}else tell('已填入「'+name+'」的 '+used.length+' 项素材。')
 }

}
async function restoreDraft({draft,images}){
 const token=++loadToken, restored=new Map()
 for(const {hash,bytes} of images)restored.set(hash,await readAsset(new Blob([bytes])))
 if(token!==loadToken)return
 const previous=snapshotVersion()
 const slots=draft.slots.map(s=>{
  if(s.imageHash){const id=++serial;assets.set(id,restored.get(s.imageHash));s.asset=id;delete s.imageHash}return s
 })
 reference=customRef=restored.get(draft.referenceHash).im
 layout={source:draft.source,name:draft.name,w:draft.w,h:draft.h,slots,resumed:true};bank=[];bankKey=null;refKey=null
 selected=slots.findIndex(s=>s.k!=='line');setDraw('');$('detect').hidden=false;$('refLabel').textContent='画板保存的参考'
 populate();render();rememberPrevious(previous);tell('已恢复生成时的内容。完成后可生成新的修订画板。')
}
$('generate').onclick=async()=>{
 if(!layout.slots.some(s=>s.content?.trim()||s.asset)){tell('请先填写文字或插入图片。');return}
 const slots=layout.slots.map(s=>s.asset?{...s,...pose(s),bytes:assets.get(s.asset).bytes}:{...s})
 $('generate').disabled=true
 try{
  const canvas=document.createElement('canvas');canvas.width=reference.width;canvas.height=reference.height
  canvas.getContext('2d').drawImage(reference,0,0)
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'))
  send('generate',{...layout,slots,referenceBytes:new Uint8Array(await blob.arrayBuffer())})
 }catch(e){$('generate').disabled=false;tell('保存参考图失败，请重试。')}
}
async function acceptReference(data){
 discardShot()
 const token=++loadToken
 const canvas=document.createElement('canvas')
 canvas.width=Math.max(1,Math.round(data.w*data.scale));canvas.height=Math.max(1,Math.round(data.h*data.scale))
 const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height)
 for(const layer of data.layers){
  const bitmap=await createImageBitmap(new Blob([layer.bytes]))
  ctx.drawImage(bitmap,layer.x*data.scale,layer.y*data.scale,layer.w*data.scale,layer.h*data.scale);bitmap.close()
 }
 if(token!==loadToken)return
 const previous=snapshotVersion()
 if(data.key===bankKey){bank=[];bankKey=null}
 if(data.raster||!data.slots.length){await importRef(canvas,previous);if(reference===canvas)refKey=data.key;return}
 refKey=data.key
 if(layout&&!customRef)drafts.set(currentPreset,layout)
 reference=customRef=canvas;layout={w:data.w,h:data.h,name:data.name,slots:data.slots}
 selected=0;setDraw('');$('detect').hidden=false
 showCatalog()
 $('refLabel').textContent='画布选区';populate();fillBank();render();rememberPrevious(previous)
 tell('已按选区图层建立 '+data.slots.length+' 个区域。点击右侧填写，或选另一组素材后点「从画布选区填入」。')
}

    send('wakeCapture')

   }
  }
  if(m.type==='catalogState'){readCatalog(m.data.state);if(m.data.edited)libraryNotice('已更新本文件的版式库。')}
  if(m.type==='catalogFail'){if($('museum').open)$('museumStatus').textContent='无法保存，请检查文件编辑权限。';pending=false;lastChange=null;showCatalog();libraryNotice(catalogReady?'无法保存，请检查文件编辑权限。':'无法读取本文件的版式库。')}
  if(m.type==='canvasReference')await acceptReference(m.data)
  if(m.type==='reference'){const a=await readAsset(new Blob([m.data[0].bytes]));await importRef(a.im)}
  if(m.type==='draft')await restoreDraft(m.data)
  if(m.type==='selectionInfo')$('resume').hidden=$('homeResume').hidden=!m.data.resumable
  if(m.type==='selectionInfo')hasCanvasMaterials=!!(m.data.images||m.data.texts)
  if(m.type==='selectionInfo')$('read').textContent='填入素材 · '+m.data.images+' 图 / '+m.data.texts+' 文'
  if(m.type==='pickHint')$('pickHint').textContent=m.data
  if(m.type==='picked'){
   try{
    const items=await decodeItems(m.data.items)
    finishPick()
    if(!m.data.batch&&items.length===1&&pickTarget&&layout.slots.includes(pickTarget)&&items[0].k===pickTarget.k){
     const previous=saveBeforeFill();assign(pickTarget,items[0]);selected=layout.slots.indexOf(pickTarget);populate();render();rememberPrevious(previous)
     tell('已填入「'+pickTarget.n+'」。可用版本菜单返回填入前。')
    }else mapGroup(items,'',true)
   }catch(e){finishPick();throw e}
  }
  if(m.type==='materials'){
   const items=await decodeItems(m.data.items||m.data)
   if(m.data.grouped){mapGroup(items,m.data.groupName);return}
   bank=items;bankKey=m.data.key;fillBank();render();tell('已读取 '+items.length+' 项素材。选择其他参考版式可重新排列，选中单区可换用素材。')
  }
  if(m.type==='status')tell(m.data)
  if(m.type==='ready')$('generate').disabled=false
 }catch(err){tell('读取失败：'+err.message)}
}

let locRevision=0
const locCache=new Map()
function museumUrl(raw){
 try{const u=new URL(raw,'https://www.loc.gov');if(u.protocol==='http:')u.protocol='https:'
 return u.protocol==='https:'&&['www.loc.gov','loc.gov','tile.loc.gov','cdn.loc.gov','chroniclingamerica.loc.gov'].includes(u.hostname)?u.href:null}catch{return null}
}
function museumButton(text,fn){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=fn;return b}
function museumCards(rows){
 const grid=$('museumGrid');grid.replaceChildren()
 for(const row of rows){
  const card=document.createElement('article'),im=document.createElement('img'),title=document.createElement('strong'),kind=document.createElement('small')
  im.alt='';im.loading='lazy';im.src=row.embedded||row.preview;im.onerror=()=>im.hidden=true
  title.textContent=row.title;title.dataset.verbatim='';kind.textContent='参考图';card.append(im,kind,title)
  const link=document.createElement('a');link.textContent='原条目与使用说明';link.href=row.url;link.target='_blank';link.rel='noopener';card.append(link)
  const use=museumButton('用作左侧参考',()=>loadMuseum(row,false,use))
  const save=museumButton('收藏到本文件',()=>loadMuseum(row,true,save))
  save.dataset.museumId=row.id;card.append(use,save);grid.append(card)
 }
 updateMuseumSaved()
}
function updateMuseumSaved(){
 for(const b of $('museumGrid').querySelectorAll('[data-museum-id]')){
  const saved=savedRefs.has(b.dataset.museumId);b.disabled=pending||!catalogReady||saved;b.textContent=saved?'已收藏':'收藏到本文件'
 }
}
async function loadMuseum(row,save,button){
 const revision=locRevision;button.disabled=true;$('museumStatus').textContent='正在读取参考图…'
 try{
  let v=locCache.get(row.id)
  if(!v){
   let im
   if(row.embedded)im=await imageFrom(row.embedded)
   else for(const url of row.images.slice().reverse()){
    try{const r=await fetch(url,{signal:AbortSignal.timeout(8000)});if(!r.ok)continue
     const blob=await r.blob();if(blob.size>16000000)continue
     im=(await readAsset(blob)).im;break}catch{}
   }
   if(!im)throw Error()
   const canvas=document.createElement('canvas'),ratio=Math.min(1,1800/Math.max(im.width,im.height))
   canvas.width=Math.max(1,Math.round(im.width*ratio));canvas.height=Math.max(1,Math.round(im.height*ratio));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height)
   v={name:row.title,w:canvas.width,h:canvas.height,slots:detectRegions(canvas),ref:canvas.toDataURL('image/webp',.88),source:row.url,kind:'museum'}
   if(locCache.size>=8)locCache.delete(locCache.keys().next().value)
   locCache.set(row.id,v)
  }
  if(revision!==locRevision||!$('museum').open)return
  if(save){changeCatalog({id:row.id,v},true);$('museumStatus').textContent=''}
  else await useMuseum(v)
 }catch{if(revision===locRevision)$('museumStatus').textContent='图片暂时无法载入，可打开原条目查看。'}
 finally{button.disabled=false;updateMuseumSaved()}
}
async function useMuseum(v){
 const token=++loadToken,previous=snapshotVersion(),im=await imageFrom(v.ref)
 if(token!==loadToken)return
 if(layout&&!customRef)drafts.set(currentPreset,layout)
 discardShot();$('museum').close();$('library').close();reference=customRef=im;refKey=null
 layout={name:v.name,w:v.w,h:v.h,source:v.source,slots:v.slots.map(s=>({...s,content:'',auto:false}))}
 selected=layout.slots.length?0:-1;setDraw('');$('detect').hidden=false;$('refLabel').textContent=v.source.startsWith('https://commons.wikimedia.org/')?'维基共享资源 · 参考图':'美国国会图书馆 · 参考图'
 populate();fillBank();render();rememberPrevious(previous);showCatalog()
 if(!structureMode)$('structure').click()
 tell(layout.slots.length?'已估算图文区域，可在左图补框或删除区域。':'未检测到清晰区域，请在左图手动框选。')
}
async function searchLOC(e){
 e.preventDefault();const revision=++locRevision
 const input=$('museumQuery').value.trim()
 if(!input){museumCards(locExamples);$('museumStatus').textContent='精选馆藏';return}
 const terms={'海报':'poster','报刊':'newspaper','报纸':'newspaper','版画':'print','书籍':'books','杂志':'magazine','封面':'cover','展览':'exhibition','多栏':'newspaper'}
 const q=input.replace(/海报|报刊|报纸|版画|书籍|杂志|封面|展览|多栏/g,k=>' '+terms[k]+' ').trim()
 $('museumStatus').textContent='正在搜索馆藏…'
 const url=new URL('https://www.loc.gov/search/');url.search=new URLSearchParams({q,fo:'json',c:'24',at:'results',fa:'online-format:image'}).toString()
 try{
  const res=await fetch(url,{signal:AbortSignal.timeout(12000)});if(!res.ok)throw Error()
  const data=await res.json();if(!Array.isArray(data.results))throw Error()
  const rows=[]
  for(const r of data.results){
   const url=museumUrl(r.id||r.url),images=(Array.isArray(r.image_url)?r.image_url:[]).map(museumUrl).filter(Boolean)
   if(!url||!images.length||!r.title)continue
   const slug=new URL(url).pathname.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()
   rows.push({id:'public-loc-'+slug,title:r.title,url,images,preview:images[0]})
  }
  if(revision!==locRevision)return;museumCards(rows);$('museumStatus').textContent=rows.length?'':'没有带预览图的结果，请换个关键词。'
 }catch{if(revision===locRevision){museumCards(locExamples);$('museumStatus').textContent='馆藏搜索暂时不可用，以下为精选馆藏。'}}
}
function commonsQuery(input){
 const words={'招贴':'poster','海报':'poster','报纸':'newspaper','报刊':'newspaper','封面':'cover','杂志':'magazine','展览':'exhibition','版画':'print','排版':'typography','字体':'typography','书籍':'book','目录':'catalogue','广告':'advertisement','日本':'Japan','法国':'France','电影':'film','瑞士':'Swiss'}
 return input.replace(/招贴|海报|报纸|报刊|封面|杂志|展览|版画|排版|字体|书籍|目录|广告|日本|法国|电影|瑞士/g,w=>' '+words[w]+' ').trim().replace(/\s+/g,' ')||'poster'
}
function commonsTitle(input){
 if(!/^https?:\/\//i.test(input))return ''
 const u=new URL(input)
 if(u.hostname!=='commons.wikimedia.org'&&u.hostname!=='commons.m.wikimedia.org')throw Error('link')
 const title=u.pathname.startsWith('/wiki/')?decodeURIComponent(u.pathname.slice(6)):u.searchParams.get('title')
 if(!title||!/^File:/i.test(title))throw Error('link')
 return title
}
function siteLink(){
 const input=$('museumQuery').value.trim(),loc=$('museumProvider').value==='loc'
 const url=new URL(loc?'https://www.loc.gov/search/':'https://commons.wikimedia.org/wiki/Special:MediaSearch')
 url.searchParams.set(loc?'q':'search',commonsQuery(input));if(!loc)url.searchParams.set('type','image')
 $('museumSite').href=url.href
}
async function searchCommons(e){
 if(e)e.preventDefault()
 siteLink()
 if($('museumProvider').value==='loc')return searchLOC({preventDefault(){}})
 const revision=++locRevision,input=$('museumQuery').value.trim(),api=new URL('https://commons.wikimedia.org/w/api.php')
 museumCards([]);$('museumStatus').textContent='正在搜索维基共享资源…'
 try{
  const title=commonsTitle(input)
  api.search=new URLSearchParams({action:'query',format:'json',origin:'*',prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'900',...(title?{titles:title,redirects:'1'}:{generator:'search',gsrnamespace:'6',gsrlimit:'20',gsrsearch:commonsQuery(input)})}).toString()
  const res=await fetch(api,{credentials:'omit',signal:AbortSignal.timeout(15000)})
  if(!res.ok)throw Error()
  const result=await res.json();if(result.error)throw Error()
  const rows=[]
  for(const page of Object.values(result.query?.pages||{}).sort((a,b)=>a.index-b.index)){
   const info=page.imageinfo?.[0];if(!info||!info.mime?.startsWith('image/'))continue
   const trusted=raw=>{try{const u=new URL(raw);return u.protocol==='https:'&&['upload.wikimedia.org','thumb.wikimedia.org'].includes(u.hostname)?u.href:null}catch{return null}}
   const preview=trusted(info.thumburl)||trusted(info.url),original=trusted(info.url)
   if(!preview||!page.pageid)continue
   rows.push({id:'public-commons-'+page.pageid,title:page.title.replace(/^File:/i,'').replace(/\.[a-z0-9]+$/i,''),url:'https://commons.wikimedia.org/wiki/'+encodeURIComponent(page.title.replaceAll(' ','_')),preview,images:[...new Set([original,preview].filter(Boolean))]})
  }
  if(revision!==locRevision)return
  museumCards(rows);$('museumStatus').textContent=rows.length?'维基共享资源 · '+rows.length+' '+displayLabel('张参考图'):'没有带预览图的结果，请换个关键词。'
 }catch(err){
  if(revision===locRevision)$('museumStatus').textContent=err.message==='link'?'请粘贴维基共享资源的 File: 作品页链接。':'在线搜索暂时不可用，可重试或打开网站搜索。'
 }
}
function selectSearchProvider(){
 const pinterest=$('museumProvider').value==='pinterest'
 $('museumSubmit').textContent=pinterest?'在 Pinterest 搜索 ↗':'搜索馆藏'
 $('museumQuery').placeholder=pinterest?'输入排版关键词':'关键词或维基共享资源作品页链接'
 $('pinCapture').hidden=!pinterest
 $('museumSite').hidden=pinterest
 if(pinterest){
  locRevision++
  museumCards([])
  $('museumStatus').textContent='挑好图片后，回到这里截图。'
 }else searchCommons()
}
$('quickPin').onsubmit=e=>{
 e.preventDefault()
 $('museumQuery').value=$('quickPin').querySelector('input').value.trim()
 openReferenceSearch()
}
$('museumForm').onsubmit=e=>{
 if($('museumProvider').value!=='pinterest')return searchCommons(e)
 e.preventDefault()
 send('searchPinterest',$('museumQuery').value.trim())
}
$('museumProvider').onchange=selectSearchProvider
$('museumQuery').oninput=siteLink
$('pinCapture').onclick=()=>{$('museum').close();startCapture(macCapture)}
function openReferenceSearch(){
 $('museumClose').textContent=$('library').open?'返回版式库':'返回编辑'
 $('museum').showModal()
 $('museumProvider').value='pinterest'
 selectSearchProvider()
 $('museumQuery').focus()
}
$('museumOpen').onclick=openReferenceSearch
$('museumClose').onclick=()=>$('museum').close()
$('museum').addEventListener('close',()=>{locRevision++})

const checkedRefs=new Set()
const topics=['问题分析 因果 problem analysis cause diagram','书籍 封面 文献 book literature review cover','采访 问答 访谈 interview comparison Q&A','步骤 流程 process workflow diagram','人物 三人访谈 引述 interview quotes people','论文 研究 文献 bibliography papers literature','新闻 背景 研究问题 news research question']
const entries=templates.map((v,i)=>({id:'base-'+i,v,index:i,base:true}))
let hiddenRefs=new Set(), savedRefs=new Set(), onlineRefs=[], catalogMode='local', lastChange=null, catalogReady=false, pending=false, loadingOnline=false, onlineFailed=false
function libraryNotice(msg){$('catalogNotice').textContent=msg}
function showCatalog(){
 const gallery=$('gallery'),query=$('catalogSearch').value.trim().toLowerCase()
 const list=catalogMode==='online'?onlineRefs:entries.filter(e=>e.base?!hiddenRefs.has(e.id):savedRefs.has(e.id))
 gallery.replaceChildren()
 for(const entry of list){
  const {v,id}=entry
  if(!query.split(/\s+/).every(word=>[v.name,englishLabel(v.name),entry.tags||topics[Number(entry.id.split('-')[1])]||''].join(' ').toLowerCase().includes(word)))continue
  const card=document.createElement('div');card.className='refCard'
  const pick=document.createElement('button'),image=document.createElement('img')
  image.src=v.ref;image.loading='lazy';image.alt='';pick.className='templatePick';pick.append(image,document.createTextNode(v.name))
  const kind=document.createElement('small');kind.textContent=v.kind==='museum'?'参考图':'可填写版式';pick.append(kind)
  pick.setAttribute('aria-pressed',String(!customRef&&entry.index===currentPreset))
  if(catalogMode==='local'){
   pick.onclick=()=>choose(entry.index)
   const remove=document.createElement('button');remove.className='removeRef';remove.type='button';remove.textContent='×'
   remove.title=displayLabel('从本文件移除')+' · '+displayLabel(v.name);remove.setAttribute('aria-label',remove.title);remove.disabled=!catalogReady||pending
   remove.onclick=()=>changeCatalog(entry,false);card.append(pick,remove)
  }else{
   const check=document.createElement('input');check.type='checkbox';check.checked=savedRefs.has(id)||checkedRefs.has(id);check.disabled=savedRefs.has(id)||pending||!catalogReady
   check.dataset.refId=id;check.setAttribute('aria-label',displayLabel('加入本文件')+' · '+displayLabel(v.name))
   pick.disabled=check.disabled;pick.onclick=()=>{check.click()};card.append(pick,check)
  }
  gallery.append(card)
 }
 if(!gallery.childElementCount){const p=document.createElement('p');p.textContent=loadingOnline?'正在读取版式…':onlineFailed&&catalogMode==='online'?'在线库暂时打不开，请重试。':'没有匹配的版式';gallery.append(p)}
 $('retryRefs').hidden=!onlineFailed;$('onlineTools').hidden=catalogMode!=='online';$('saveChecks').disabled=pending||!catalogReady||!checkedRefs.size
 $('browseRefs').textContent=catalogMode==='online'?'返回本文件':'搜索在线版式'
 $('recoverRefs').hidden=catalogMode!=='local'||!hiddenRefs.size;$('undoRef').hidden=!lastChange
}
function ensureEntry(e){
 let existing=entries.find(a=>a.id===e.id)
 if(existing)return existing
 const index=templates.push(e.v)-1
 existing={...e,index};entries.push(existing);$('preset').add(new Option(e.v.name,index));return existing
}
function changeCatalog(e,visible){submitChanges([{id:e.id,v:e.v,visible}])}
function submitChanges(changes,undo=false){
 if(pending||!catalogReady||!changes.length)return
 pending=true;lastChange=undo?null:changes.map(c=>({...c,visible:!c.visible}));send('editCatalog',changes.map(({id,v,visible})=>({id,visible,v:visible&&!id.startsWith('base-')?v:undefined})));showCatalog()
}
function readCatalog(state){
 hiddenRefs=new Set(state.hidden);savedRefs=new Set(state.saved.map(e=>e.id))
 state.saved.forEach(e=>{ensureEntry(e);checkedRefs.delete(e.id)})
 for(const e of entries)$('preset').options[e.index].hidden=e.base?hiddenRefs.has(e.id):!savedRefs.has(e.id)
 catalogReady=true;pending=false;showCatalog();updateMuseumSaved()
}
async function browseCatalog(){
 catalogMode='online';showCatalog()
 if(onlineRefs.length||loadingOnline)return
 loadingOnline=true;onlineFailed=false;showCatalog()
 const path='https://raw.githubusercontent.com/ZhichenGu/figma-desk-tools/main/'
 try{
  let rows
  const res=await fetch(path+'catalog/index.json',{signal:AbortSignal.timeout(12000)})
  if(res.ok)rows=await res.json()
  else if(res.status===404){
   // Earlier releases embedded their public schematic library as a JSON array.
   const old=await fetch(path+'LayoutDesk/ui.html',{signal:AbortSignal.timeout(12000)});if(!old.ok)throw Error()
   const match=(await old.text()).match(/^const templates=(\[.*\])$/m);if(!match)throw Error()
   rows=JSON.parse(match[1]).map((v,i)=>({id:'public-'+i,v,tags:topics[i]}))
  }else throw Error()
  onlineRefs=rows.filter(e=>/^public-[a-z0-9-]+$/.test(e.id)&&typeof e.v?.name==='string'&&/^data:image\/(png|webp|jpeg);base64,/.test(e.v.ref)&&e.v.w>0&&e.v.h>0&&Array.isArray(e.v.slots))
 }catch{onlineFailed=true}finally{loadingOnline=false;showCatalog()}
}
$('browseRefs').onclick=()=>{libraryNotice('');if(catalogMode==='online'){catalogMode='local';showCatalog()}else browseCatalog()}
$('retryRefs').onclick=browseCatalog
$('catalogSearch').oninput=showCatalog
$('gallery').onchange=e=>{const c=e.target;if(c.checked)checkedRefs.add(c.dataset.refId);else checkedRefs.delete(c.dataset.refId);$('saveChecks').disabled=!checkedRefs.size}
$('saveChecks').onclick=()=>{submitChanges(onlineRefs.filter(e=>checkedRefs.has(e.id)).map(e=>({...e,visible:true})))}
$('recoverRefs').onclick=()=>submitChanges(entries.filter(e=>hiddenRefs.has(e.id)).map(e=>({...e,visible:true})))
$('undoRef').onclick=()=>submitChanges(lastChange,true)
templates.forEach((v,i)=>$('preset').add(new Option(v.name,i)))
showCatalog();send('getCatalog')
$('preset').onchange=()=>choose(Number($('preset').value))
new ResizeObserver(()=>render()).observe($('rightStage'));window.addEventListener('resize',render);choose(1).then(()=>send('initial'))
</script></html>
